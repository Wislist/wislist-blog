#:schema node_modules/wrangler/config-schema.json
name = "twikoo"
main = "src/index.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"

# 数据库：先执行 `npx wrangler d1 create twikoo`，
# 把它输出的 database_id 替换到下面（database_name 保持一致）
[[d1_databases]]
binding = "DB"
database_name = "twikoo"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 图片上传用（不做图片上传可以删掉这 3 行，同时删掉 SETUP 里的 r2 命令）
[[r2_buckets]]
binding = "R2"
bucket_name = "twikoo"

[vars]
# R2 公开访问地址；暂不做图片上传可留空
R2_PUBLIC_URL = ""

[dev]
port = 5000
